cluster:
  name: <CLUSTER_NAME>
  rke2_version: v1.35.5+rke2r2
  registration_endpoint: https://<FIXED_REGISTRATION_ADDRESS>:9345
  api_endpoint: https://<FIXED_REGISTRATION_ADDRESS>:6443
  cni: canal

nodes:
  control_plane:
    # Repeat this item for every server. Use an odd count for embedded etcd.
    - hostname: <SERVER_HOSTNAME>
      address: <SERVER_IP>
      bootstrap: true
  workers:
    # Repeat this item for zero or more workers.
    - hostname: <WORKER_HOSTNAME>
      address: <WORKER_IP>
