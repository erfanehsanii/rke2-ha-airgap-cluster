global
  log stdout format raw local0
  maxconn 4096

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 50s
  timeout server 50s

frontend kubernetes_api
  bind <LOAD_BALANCER_IP>:6443
  default_backend kubernetes_api_servers

backend kubernetes_api_servers
  option tcp-check
  balance roundrobin
  # Add one line for every RKE2 server. Do not add workers.
  server control-plane-01 <CONTROL_PLANE_01_IP>:6443 check
  server control-plane-02 <CONTROL_PLANE_02_IP>:6443 check
  server control-plane-03 <CONTROL_PLANE_03_IP>:6443 check

frontend rke2_registration
  bind <LOAD_BALANCER_IP>:9345
  default_backend rke2_registration_servers

backend rke2_registration_servers
  option tcp-check
  balance roundrobin
  # Repeat the same RKE2 server list used by the API backend.
  server control-plane-01 <CONTROL_PLANE_01_IP>:9345 check
  server control-plane-02 <CONTROL_PLANE_02_IP>:9345 check
  server control-plane-03 <CONTROL_PLANE_03_IP>:9345 check
